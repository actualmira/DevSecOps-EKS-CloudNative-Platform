apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: falco-sidekick-delete
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: falco-sidekick-rolebinding
  namespace: production
subjects:
  - kind: ServiceAccount
    name: falco-falcosidekick
    namespace: falco
roleRef:
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
  name: falco-sidekick-delete
