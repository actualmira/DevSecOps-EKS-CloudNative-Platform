apiVersion: constraints.gatekeeper.sh/v1beta1
kind: EnforceNetworkPolicy
metadata:
  name: enforce-network-policy
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet"]
      - apiGroups: ["batch"]
        kinds: ["Job"]
    excludedNamespaces:
      - kube-system
