apiVersion: constraints.gatekeeper.sh/v1beta1
kind: EnforceReadOnlyRootFilesystem
metadata:
  name: enforce-read-only-root-filesystem
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet"]
      - apiGroups: ["batch"]
        kinds: ["Job"]

