apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dvwa
  template:
    metadata:
      labels:
        app: dvwa
    spec:
      containers:
        - name: dvwa
          image: ghcr.io/digininja/dvwa:latest
          securityContext:
            runAsNonRoot: true
            runAsUser: 998
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 80
          env:
            - name: DB_SERVER
              value: "mariadb-svc.production.svc.cluster.local"
            - name: DB_DATABASE
              value: "dvwa"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: db-password
            - name: DB_PORT
              value: "3306"
---
apiVersion: v1
kind: Service
metadata:
  name: dvwa-svc
  namespace: production
spec:
  selector:
    app: dvwa
  ports:
    - port: 80
      targetPort: 80
  type: NodePort
