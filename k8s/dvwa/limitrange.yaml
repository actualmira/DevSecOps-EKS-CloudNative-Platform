apiVersion: v1
kind: LimitRange
metadata:
  name: dvwa-limits
  namespace: dvwa
spec:
  limits:
    - type: Container
      default:
        cpu: "200m"
        memory: "256Mi"
      defaultRequest:
        cpu: "50m"
        memory: "128Mi"
      max:
        cpu: "500m"
        memory: "512Mi"
      min:
        cpu: "10m"
        memory: "64Mi"
