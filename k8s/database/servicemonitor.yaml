apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mariadb
  namespace: database
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: mariadb
  endpoints:
    - port: metrics
      interval: 30s
      path: /metrics
