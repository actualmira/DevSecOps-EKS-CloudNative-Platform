apiVersion: v1
kind: Namespace
metadata:
  name: database
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mariadb-sva
  namespace: database
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-init
  namespace: database
data:
  init.sh: |
    #!/bin/sh
    MYSQL_PWD="${MARIADB_ROOT_PASSWORD}" mysql -u root <<EOF
    CREATE USER IF NOT EXISTS 'healthcheck'@'127.0.0.1' IDENTIFIED BY '${HEALTHCHECK_PASSWORD}';
    CREATE USER IF NOT EXISTS 'exporter'@'127.0.0.1' IDENTIFIED BY '${EXPORTER_PASSWORD}' WITH MAX_USER_CONNECTIONS 3;
    ALTER USER 'healthcheck'@'127.0.0.1' IDENTIFIED VIA mysql_native_password USING PASSWORD('${HEALTHCHECK_PASSWORD}');
    ALTER USER 'exporter'@'127.0.0.1' IDENTIFIED VIA mysql_native_password USING PASSWORD('${EXPORTER_PASSWORD}');
    GRANT PROCESS, REPLICATION CLIENT ON *.* TO 'exporter'@'127.0.0.1';
    GRANT SELECT ON performance_schema.* TO 'exporter'@'127.0.0.1';
    REVOKE ALL PRIVILEGES ON dvwa.* FROM '${MARIADB_USER}'@'%';
    GRANT SELECT, INSERT, UPDATE ON dvwa.* TO '${MARIADB_USER}'@'%';
    DROP USER IF EXISTS 'root'@'%';
    FLUSH PRIVILEGES;
    EOF
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  namespace: database
spec:
  serviceName: mariadb-svc
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      nodeSelector:
        role: isolated
      tolerations:
        - key: "workload"
          operator: "Equal"
          value: "isolated"
          effect: "NoSchedule"
      automountServiceAccountToken: false
      serviceAccountName: mariadb-sva
      securityContext:
        runAsNonRoot: true
        fsGroup: 999
        fsGroupChangePolicy: "OnRootMismatch"
      containers:
        - name: mariadb
          image: mariadb:10
          securityContext:
            allowPrivilegeEscalation: false
            runAsUser: 999
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uhealthcheck -p${HEALTHCHECK_PASSWORD}
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - mysqladmin ping -h 127.0.0.1 -uhealthcheck -p${HEALTHCHECK_PASSWORD}
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: root-password
            - name: MARIADB_DATABASE
              value: "dvwa"
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: db-user
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: db-password
            - name: HEALTHCHECK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret
                  key: healthcheck-password
            - name: EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-monitoring-secret
                  key: exporter-password
          ports:
            - containerPort: 3306
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/mysqld
        - name: mysqld-exporter
          image: prom/mysqld-exporter:v0.15.1
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65534
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          args:
            - --no-collect.info_schema.innodb_tablespaces
            - --no-collect.perf_schema.file_instances
            - --no-collect.slave_status
            - --mysqld.address=127.0.0.1:3306
            - --mysqld.username=exporter
          env:
            - name: MYSQLD_EXPORTER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-monitoring-secret
                  key: exporter-password
          ports:
            - containerPort: 9104
              name: metrics
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: init-script
          configMap:
            name: mariadb-init
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: mariadb-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: ebs-sc
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb-svc
  namespace: database
  labels:
    app: mariadb
spec:
  selector:
    app: mariadb
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
    - port: 9104
      targetPort: 9104
      name: metrics
  clusterIP: None
