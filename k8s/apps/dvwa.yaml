apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-app
  namespace: production
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dvwa
  template:
    metadata:
      labels:
        app: dvwa
    spec:
      automountServiceAccountToken: false
      serviceAccountName: dvwa-sva
      containers:
        - name: dvwa
          image: ghcr.io/digininja/dvwa:33e364c
          securityContext:
            runAsNonRoot: true
            runAsUser: 998
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /login.php
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          env:
            - name: DB_SERVER
              value: "mariadb-svc.production.svc.cluster.local"
            - name: DB_DATABASE
              value: "dvwa"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret-eso
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb-secret-eso
                  key: db-password
            - name: DB_PORT
              value: "3306"
          resources:
            requests:
              cpu: "50m"
              memory: "256Mi"
            limits:
              cpu: "400m"
              memory: "512Mi"
          volumeMounts:
            - name: dvwa-data
              mountPath: /tmp
            - name: apache-run
              mountPath: /var/run/apache2
            - name: dvwa-uploads
              mountPath: /var/www/html/hackable/uploads

      volumes:
        - name: dvwa-data
          emptyDir: {}
        - name: apache-run
          emptyDir: {}
        - name: dvwa-uploads
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: dvwa-svc
  namespace: production
spec:
  selector:
    app: dvwa
  ports:
    - port: 80
      targetPort: 80
  type: NodePort
