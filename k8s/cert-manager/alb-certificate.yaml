apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dvwa-tls
  namespace: dvwa
spec:
  secretName: dvwa-tls-secret
  duration: 2160h
  renewBefore: 360h
  isCA: false
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - "*.eu-west-1.elb.amazonaws.com"
    - "*.elb.amazonaws.com"
  issuerRef:
    name: internal-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
